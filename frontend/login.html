<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión — Dinamikus CRM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span>◆</span> Dinamikus CRM</div>
      <p class="muted">Inicia sesión para gestionar tus leads y canales.</p>
      <div id="error" class="auth-error"></div>
      <form id="loginForm">
        <label>Correo
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Contraseña
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <div class="switch">¿Tu negocio aún no está registrado? <a href="/register.html">Crear cuenta</a></div>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      errorBox.classList.remove('visible');

      const form = new FormData(e.target);
      const body = { email: form.get('email'), password: form.get('password') };

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json();

        if (!r.ok) {
          errorBox.textContent = data.error || 'No se pudo iniciar sesión';
          errorBox.classList.add('visible');
          return;
        }

        setSession(data.token, data.user, data.tenant);
        window.location.href = '/';
      } catch {
        errorBox.textContent = 'Error de conexión. Intenta de nuevo.';
        errorBox.classList.add('visible');
      }
    });
  </script>
</body>
</html>
